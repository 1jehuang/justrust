# The page: a Dioxus app rustc builds (`build-dioxus.sh`), whole, for `app` to link into.
[package]
name = "playground"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
dioxus.workspace = true
dioxus-code = { version = "0.1", features = ["runtime"] }
dioxus-code-editor = "0.1"
futures-channel = "0.3"
futures-util = "0.3"
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = ["Location", "MediaQueryList", "Storage", "Window"] }
