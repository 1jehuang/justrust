[package]
name = "core-macro"
version = "0.0.0"
# The edition of `dioxus-core-macro`, whose source this compiles.
edition = "2021"
publish = false

[dependencies]
# Not linked: `build.rs` copies its source out of cargo's registry.
dioxus-core-macro = "=0.7.10"
dioxus-rsx = "=0.7.10"
convert_case = "0.8.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
