name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      # Dogfood: the freshly built binary checks and tests a scratch crate.
      - name: Smoke test the binary
        run: |
          cargo build --locked
          bin="$PWD/target/debug/justrust"
          cargo new -q "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$bin" check
          "$bin" test
          echo 'fn main() { let _x: u32 = "a"; }' > src/main.rs
          if "$bin" check; then echo "expected a compile error"; exit 1; fi
      - run: cargo package --locked && rm -rf target/package

  macos:
    name: ${{ matrix.os }} (clippy, test, smoke)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      # The recorder, sampler, and report on a real macOS build.
      - name: Smoke test the binary
        run: |
          cargo build --locked
          bin="$PWD/target/debug/justrust"
          cargo new -q "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$bin" check
          "$bin" test
          "$bin" show | tee show.txt
          grep -q "not measured" show.txt
          # Memory in MB, not bytes read as KiB (ru_maxrss units differ).
          if grep -E "largest rustc [0-9]{5,} MB" show.txt; then exit 1; fi
          echo 'fn main() { let _x: u32 = "a"; }' > src/main.rs
          if "$bin" check; then echo "expected a compile error"; exit 1; fi
      # Dependency cache across target dirs, including a proc-macro dylib
      # (keyed by its Mach-O .rustc section) that must load after restore.
      - name: Depcache across checkouts
        run: |
          bin="$PWD/target/debug/justrust"
          for d in a b; do
            cargo new -q "$RUNNER_TEMP/dc-$d"
            cd "$RUNNER_TEMP/dc-$d"
            printf 'serde = { version = "1", features = ["derive"] }\nserde_json = "1"\n' >> Cargo.toml
            printf '#[derive(serde::Serialize)]\nstruct S { a: u8 }\n#[test]\nfn t() { assert_eq!(serde_json::to_string(&S { a: 1 }).unwrap(), "{\\"a\\":1}"); }\nfn main() {}\n' > src/main.rs
            JUSTRUST_DEPCACHE_EXPLAIN="$RUNNER_TEMP/explain-$d" "$bin" test 2>&1 | tee out.txt
            cd -
          done
          # Which units missed in the second checkout, and why their keys differ.
          run=$(ls -td ~/.justrust/runs/*/ | head -1)
          grep '"depcache":"miss"' "$run/units.jsonl" | grep -o '"crate_name":"[^"]*"' || true
          for f in "$RUNNER_TEMP"/dc-a/target/debug/deps/libserde_derive-*.dylib; do
            echo "== $f"; strings -a "$f" | grep -n "dc-a" | head -5
            otool -l "$f" | grep -A3 "LC_ID_DYLIB\|LC_RPATH" | head -10
          done
          ls "$RUNNER_TEMP/explain-a" "$RUNNER_TEMP/explain-b" | sort | uniq -u || true
          for f in $(ls "$RUNNER_TEMP/explain-b"); do
            [ -f "$RUNNER_TEMP/explain-a/$f" ] || { n=${f%-*}; echo "== $f"; diff "$RUNNER_TEMP"/explain-a/"$n"-* "$RUNNER_TEMP/explain-b/$f" | head -20; }
          done
          grep -E "depcache [0-9]+ hit" "$RUNNER_TEMP/dc-b/out.txt"
          grep -q "1 passed" "$RUNNER_TEMP/dc-b/out.txt"

  passthrough:
    name: ${{ matrix.os }} (passthrough build)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked
      - run: cargo build --locked
      - name: Passthrough runs plain cargo
        shell: bash
        run: |
          bin="$PWD/target/debug/justrust"
          cargo new -q "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$bin" check
          "$bin" --version

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
