change-id = "ignore"
profile = "compiler"

[build]
submodules = false
docs = false
compiler-docs = false
extended = false
profiler = true

[rust]
incremental = false
lto = "thin"
codegen-units = 1
channel = "nightly"
debug-assertions = false
debug-logging = false
debuginfo-level = "line-tables-only"
jemalloc = true
frame-pointers = false
backtrace-on-ice = false
download-rustc = false
codegen-backends = ["llvm", "cranelift"]

[llvm]
download-ci-llvm = true
assertions = false
