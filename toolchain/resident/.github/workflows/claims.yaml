# The claims of docs/results.md that no job of ra-jit.yaml runs: rustc's own `tests/ui`
# run-pass tests give the same output built by ra-jit, and the scoreboard of real crates does
# not lose coverage. Nightly and by hand, all of tests/ui (about 3800 programs, both backends);
# a pull request has the pinned few of them in ra-jit.yaml's pinned-ui job. A failed nightly
# opens an issue, or adds to the one still open.
name: claims
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "tests/ui programs to run (empty means all)"
        required: false

concurrency:
  group: claims-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  tests-ui:
    name: rustc tests/ui run-pass (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        backend: [cranelift, llvm]
    env:
      RA_JIT_BACKEND: ${{ matrix.backend }}
      RA_JIT_OPT: 2
      RA_JIT_EMIT: fast
      EVENT: ${{ github.event_name }}
      INPUT_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
      - run: nix develop --command cargo build -p ra-jit --release --features llvm
      # The tests from rust-lang/rust at the pinned nightly commit.
      - name: rust-lang/rust, the pinned nightly, tests only
        run: |
          commit=$(awk '/^commit /{print $2}' crates/ra-jit/src/cargo/toolchain/pins.txt)
          git init -q "$RUNNER_TEMP/rust-pin"
          cd "$RUNNER_TEMP/rust-pin"
          git remote add origin https://github.com/rust-lang/rust
          git sparse-checkout set tests/ui tests/auxiliary
          git fetch -q --depth 1 --filter=blob:none origin "$commit"
          git checkout -q FETCH_HEAD
      - name: tests/ui
        working-directory: harness
        run: |
          export RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit"
          LIMIT="$INPUT_LIMIT"
          python3 uitest.py "$RUNNER_TEMP/rust-pin" ${LIMIT:+--limit "$LIMIT"} --jobs 4 --work "$RUNNER_TEMP/ui" --json "$RUNNER_TEMP/ui.json" || status=$?
          python3 uigate.py "$RUNNER_TEMP/ui.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  scoreboard:
    name: scoreboard (real crates, both backends)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          llvm: build
      - uses: Swatinem/rust-cache@v2
      - run: nix develop --command cargo build -p ra-jit --release --features llvm
      - name: scoreboard
        working-directory: harness
        run: RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit" python3 scoreboard.py

  nightly:
    name: nightly issue
    needs: [tests-ui, scoreboard]
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nightly-issue
