[package]
name = "justrust-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Execution graph validation and reporting for justrust"
license = "MIT"
repository = "https://github.com/1jehuang/justrust"

[dependencies]
anyhow = "1"
libc = "0.2.190"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
dirs = "6"
