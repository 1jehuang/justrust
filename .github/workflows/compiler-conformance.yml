name: Compiler compatibility evidence index

on:
  push:
    branches: [main]
    paths: ['src/**', 'libraries/**', 'tests/**', 'tools/**', 'data/compiler-*.json', 'Cargo.toml', '.github/workflows/compiler-conformance.yml']
  pull_request:
    paths: ['src/**', 'libraries/**', 'tests/**', 'tools/**', 'data/compiler-*.json', 'Cargo.toml', '.github/workflows/compiler-conformance.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate requirement and acceptance mapping
        run: python3 tools/conformance.py validate
      - name: Reject malformed and false-success evidence
        run: |
          python3 tools/test_conformance.py -v
          python3 tools/test_compatibility_scope.py -v
          python3 tools/test_compatibility_inventory.py -v
          python3 tools/test_extract_reference_rules.py -v
          python3 tools/test_pinned_acquisition.py -v
          python3 tools/test_compact_library_surface_provenance.py -v
          python3 tools/test_classify_proc_macro_details.py -v
          python3 tools/test_reconcile_token_rules.py -v
      - name: Validate source-referenced inventory without inferring support
        run: python3 tools/compatibility_inventory.py
      - name: Report declared test obligations including missing coverage
        run: python3 tools/conformance.py coverage --json
      - name: Show complete native acceptance plan
        run: python3 tools/conformance.py plan --profile full
      # This cheap job validates the evidence system, not the compiler itself.
      # Actual native acceptance uses the installed stable justrust client via
      # tools/conformance.py run in the hosted development/CI environment.
