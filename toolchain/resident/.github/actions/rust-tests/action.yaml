# rustc's tests (tests/ui and tests/auxiliary) at the commit of the pinned nightly, in
# $RUNNER_TEMP/rust, from the Actions cache: fetching them from github.com/rust-lang/rust in every
# job was refused with HTTP 429 in 26 jobs of 2026-10-25 and 26's runs. Main alone writes the cache
# (the nightly and the pushes to main), as the other caches here; a miss fetches, trying again
# after a refusal, and says so.
name: rust tests
description: rustc's tests/ui at the pinned nightly's commit, in $RUNNER_TEMP/rust
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "commit=$(awk '/^commit /{print $2}' crates/ra-jit/src/cargo/toolchain/pins.txt)" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/rust
        key: rust-tests-ui-${{ steps.pin.outputs.commit }}
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        COMMIT: ${{ steps.pin.outputs.commit }}
      run: |
        echo "::notice::rustc's tests at $COMMIT are not in the cache: fetching them from github.com"
        rm -rf "$RUNNER_TEMP/rust"
        git init -q "$RUNNER_TEMP/rust"
        cd "$RUNNER_TEMP/rust"
        git remote add origin https://github.com/rust-lang/rust
        git sparse-checkout set tests/ui tests/auxiliary
        for wait in 0 20 60 120 240; do
          sleep "$wait"
          if git fetch -q --depth 1 --filter=blob:none origin "$COMMIT" && git checkout -q FETCH_HEAD; then
            exit 0
          fi
          echo "::warning::fetching rust-lang/rust at $COMMIT failed; trying again"
        done
        echo "::error::could not fetch rust-lang/rust at $COMMIT in 5 tries"
        exit 1
    - if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/rust
        key: rust-tests-ui-${{ steps.pin.outputs.commit }}
