# The stable ra-jit is pinned to (`harness/toolchain`). ra-jit computes layouts and `TypeId`s
# the way this rustc does, and the two must agree for what it links into the module rustc
# built: `downcast` across the two is one thing that depends on it.
[toolchain]
channel = "1.99.0"
components = ["rust-src"]
targets = ["wasm32-unknown-unknown"]
