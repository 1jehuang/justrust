[package]
name = "justrust-engine"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[dependencies]
blake3 = { version = "=1.8.7", default-features = false }
unicode-ident = "=1.0.24"

[features]
allocation-profile = []

[lib]
name = "justrust_engine"
path = "src/lib.rs"

[[bin]]
name = "jr-prototype"
path = "src/main.rs"

[[bin]]
name = "jr-rust"
path = "src/compiler_cli.rs"

[profile.release]
debug = 1

[profile.dev]
opt-level = 1
