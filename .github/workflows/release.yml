name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must exist)"
        required: true
      recover_linux_x86:
        description: "Publish only a missing Linux x86_64 artifact"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Marks the binaries as release builds: they update themselves
  # (src/update.rs). Source builds never do.
  JUSTRUST_RELEASE_BUILD: "1"
  # Immutable bootstrap client with fail-closed hosted routing support.
  HOSTED_CLIENT_REV: 616de6552f08a9c40a5d0a79b3d0f510ce80ff46
  # Download the reviewed published bootstrap instead of compiling it per job.
  HOSTED_CLIENT_TAG: v0.1.48
  HOSTED_CLIENT_SHA256: 0daa2acca46e9e185240e5e30c1d109929c4567d43722bf6d2ab3c6c492d55b6
  # Small, fast release binaries without editing Cargo.toml.
  DIST_FLAGS: >-
    --config profile.release.lto="thin"
    --config profile.release.codegen-units=1
    --config profile.release.strip=true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      policy_sha256: ${{ steps.policy.outputs.policy_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Verify release tag, stable ancestry, and version
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" == v* ]]
          git check-ref-format "refs/tags/$TAG"
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" refs/remotes/origin/stable
          git show "$sha:Cargo.toml" > "$RUNNER_TEMP/release-Cargo.toml"
          version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$RUNNER_TEMP/release-Cargo.toml")
          [[ "$TAG" == "v$version" ]] || { echo "Tag $TAG does not match package version $version" >&2; exit 1; }
          printf 'sha=%s\ntag=%s\n' "$sha" "$TAG" >> "$GITHUB_OUTPUT"

      - name: Freeze service-selected release compiler once
        id: policy
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          git show "$SHA:src/toolchain_policy.rs" > "$RUNNER_TEMP/release-toolchain-policy.rs"
          python3 ci/release-policy.py freeze --protocol-source "$RUNNER_TEMP/release-toolchain-policy.rs" --output "$RUNNER_TEMP/release-policy.json" >> "$GITHUB_OUTPUT"
          cp ci/release-policy.py "$RUNNER_TEMP/release-policy.py"

      - name: Prepare shared release draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          ref=$(jq -rn --arg ref "refs/tags/$TAG" '$ref | @uri')
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
          [[ "$current" == "$SHA" ]] || { echo "Release tag moved after preflight" >&2; exit 1; }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --target "$SHA" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-policy
          path: |
            ${{ runner.temp }}/release-policy.json
            ${{ runner.temp }}/release-policy.py

  build:
    needs: preflight
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Hosted mirrors preserve absolute paths. Linux needs a non-overlapping
        # root, not a child which a root-checkout test sync could delete.
        working-directory: release-client/${{ matrix.target }}
    concurrency:
      group: ${{ matrix.zig && 'justrust-hosted-linux' || format('justrust-release-{0}-{1}', github.run_id, matrix.target) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.recover_linux_x86 &&
            '[{"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","zig":true}]' ||
            '[{"target":"x86_64-unknown-linux-musl","os":"ubuntu-latest","zig":true},
              {"target":"aarch64-unknown-linux-musl","os":"ubuntu-latest","zig":true},
              {"target":"x86_64-apple-darwin","os":"macos-latest","zig":false},
              {"target":"aarch64-apple-darwin","os":"macos-latest","zig":false},
              {"target":"x86_64-pc-windows-msvc","os":"windows-latest","zig":false}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          path: release-client/${{ matrix.target }}
          # Client Cargo package excludes these separately built source trees.
          # Do not mirror a vendored compiler just to build the client.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/toolchain/
            !/.wrangler/

      - name: Isolate hosted release source from test mirror roots
        if: ${{ matrix.zig }}
        shell: bash
        working-directory: release-client/${{ matrix.target }}
        run: |
          destination="$RUNNER_TEMP/client-release/${{ matrix.target }}"
          mkdir -p "$destination"
          cp -a . "$destination/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: release-policy
          path: ${{ runner.temp }}/release-policy

      - name: Apply immutable release compiler selection
        shell: bash
        env:
          POLICY_SHA256: ${{ needs.preflight.outputs.policy_sha256 }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/release-policy/release-policy.py" env \
            --snapshot "$RUNNER_TEMP/release-policy/release-policy.json" \
            --sha256 "$POLICY_SHA256" --protocol-source src/toolchain_policy.rs --target "${{ matrix.target }}" --output "$RUNNER_TEMP/release.env"
          cat "$RUNNER_TEMP/release.env" >> "$GITHUB_ENV"

      # Owned bundles are published only for Linux x86_64 hosts today. No
      # service-owned Darwin/MSVC implementation is claimed. The snapshot
      # contains exact service-selected stock compatibility compilers there.
      - name: Install pinned compatibility Rust
        if: ${{ !matrix.zig }}
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"

      - name: Cache compatibility release dependencies
        if: ${{ !matrix.zig }}
        uses: Swatinem/rust-cache@v2
        with:
          key: client-release-${{ matrix.target }}
          workspaces: release-client/${{ matrix.target }} -> target

      - name: Build
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          set -euo pipefail
          export RUSTC
          RUSTC=$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustc)
          # shellcheck disable=SC2086
          cargo +"$RUSTUP_TOOLCHAIN" build --release --locked --target "${{ matrix.target }}" $DIST_FLAGS
          mkdir -p dist
          cargo +"$RUSTUP_TOOLCHAIN" --version > "dist/compiler-${{ matrix.target }}.txt"
          "$RUSTC" -vV >> "dist/compiler-${{ matrix.target }}.txt"
          printf 'compiler_path=%s\nmode=stock-compatibility\npolicy_sha256=%s\nsource_revision=%s\n' "$RUSTC" '${{ needs.preflight.outputs.policy_sha256 }}' '${{ needs.preflight.outputs.sha }}' >> "dist/compiler-${{ matrix.target }}.txt"

      - name: Verify native release executable
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc +"$RUSTUP_TOOLCHAIN" -vV | awk '/^host:/ {print $2}')
          if [[ "$host" != "${{ matrix.target }}" ]]; then
            echo "Cross-target binary: native execution requires its target platform"
            exit 0
          fi
          binary="target/${{ matrix.target }}/release/justrust"
          # Matrix values expand to literals during shellcheck.
          # shellcheck disable=SC2193
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary="$binary.exe"; fi
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ $("$binary" --version) == "justrust $version" ]]
          "$binary" update status | grep -F '(release build)'

      - name: Require hosted Linux credentials
        if: ${{ matrix.zig }}
        env:
          JCODE_API_KEY: ${{ secrets.JCODE_API_KEY }}
        run: ': "${JCODE_API_KEY:?Configure JCODE_API_KEY for hosted Linux releases}"'

      - name: Install hosted Linux prerequisites
        if: ${{ matrix.zig }}
        working-directory: ${{ runner.temp }}/client-release/${{ matrix.target }}
        run: |
          # Stock bootstrap also supplies pinned C-only musl ABI objects.
          # It never supplies Rust rlibs to the service-selected compiler.
          rustup toolchain install 1.99.0 --profile minimal --target "${{ matrix.target }}"
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends rsync zstd binutils qemu-user
          git fetch --quiet --no-tags --depth=1 origin "$HOSTED_CLIENT_REV"
          git show "$HOSTED_CLIENT_REV:ci/check-linux-release.sh" > "$RUNNER_TEMP/check-linux-release.sh"
          python3 ci/install-published-client.py --tag "$HOSTED_CLIENT_TAG" --sha256 "$HOSTED_CLIENT_SHA256" --github-path

      - name: Build and verify hosted Linux release
        if: ${{ matrix.zig }}
        working-directory: ${{ runner.temp }}/client-release/${{ matrix.target }}
        env:
          JCODE_API_KEY: ${{ secrets.JCODE_API_KEY }}
          JUSTRUST_REMOTE_REQUIRED: "1"
          POLICY_SHA256: ${{ needs.preflight.outputs.policy_sha256 }}
        run: |
          set -euo pipefail
          since=$(date +%s)
          justrust remote use hosted
          # Native selected-compiler linking preserves ARM erratum mitigations.
          # Only C ABI objects are staged from the exact stock bootstrap. Rust
          # target libraries are rebuilt from the selected owned compiler source.
          build_std=()
          rustflags=()
          c_runtime_attest=()
          if [[ "$JUSTRUST_TOOLCHAIN" == jr-* ]]; then
            c_runtime="$PWD/.release-c-runtime/${{ matrix.target }}"
            python3 "$RUNNER_TEMP/release-policy/release-policy.py" stage-c-runtime \
              --snapshot "$RUNNER_TEMP/release-policy/release-policy.json" \
              --sha256 "$POLICY_SHA256" --protocol-source src/toolchain_policy.rs \
              --target "${{ matrix.target }}" --output "$c_runtime"
            build_std=(-Zbuild-std)
            rustflags+=("-Lnative=$c_runtime")
            c_runtime_attest=(--c-runtime "$c_runtime")
          fi
          # Matrix values expand to literals during shellcheck.
          # shellcheck disable=SC2193
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            rustflags+=("-Clink-arg=--fix-cortex-a53-843419")
          fi
          if (( ${#rustflags[@]} )); then
            flags_json=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${rustflags[@]}")
            build_std+=(--config "target.${{ matrix.target }}.rustflags=$flags_json")
          fi
          # shellcheck disable=SC2086
          justrust build --remote --release --locked --target "${{ matrix.target }}" --bin justrust "${build_std[@]}" $DIST_FLAGS
          mkdir -p dist
          python3 "$RUNNER_TEMP/release-policy/release-policy.py" attest \
            --snapshot "$RUNNER_TEMP/release-policy/release-policy.json" \
            --sha256 "$POLICY_SHA256" --protocol-source src/toolchain_policy.rs --target "${{ matrix.target }}" \
            --source-sha '${{ needs.preflight.outputs.sha }}' "${c_runtime_attest[@]}" \
            --since "$since" --binary "target/${{ matrix.target }}/release/justrust" --output "dist/compiler-${{ matrix.target }}.json"
          version=$(cargo +1.99.0 metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "justrust") | .version')
          bash "$RUNNER_TEMP/check-linux-release.sh" "target/${{ matrix.target }}/release/justrust" "${{ matrix.target }}" "$version"

      - name: Package
        working-directory: ${{ matrix.zig && format('{0}/client-release/{1}', runner.temp, matrix.target) || format('{0}/release-client/{1}', github.workspace, matrix.target) }}
        shell: bash
        run: |
          name="justrust-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # The matrix expands to a known literal during actionlint's shellcheck.
          # shellcheck disable=SC2193
          cp "target/${{ matrix.target }}/release/justrust$( [[ "${{ matrix.target }}" == *windows* ]] && echo .exe )" "dist/$name/"
          cp README.md "dist/$name/" 2>/dev/null || true
          cp LICENSE* "dist/$name/" 2>/dev/null || true
          cd dist
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: justrust-${{ matrix.target }}
          path: |
            ${{ matrix.zig && format('{0}/client-release/{1}', runner.temp, matrix.target) || format('{0}/release-client/{1}', github.workspace, matrix.target) }}/dist/*.tar.gz
            ${{ matrix.zig && format('{0}/client-release/{1}', runner.temp, matrix.target) || format('{0}/release-client/{1}', github.workspace, matrix.target) }}/dist/*.sha256
            ${{ matrix.zig && format('{0}/client-release/{1}', runner.temp, matrix.target) || format('{0}/release-client/{1}', github.workspace, matrix.target) }}/dist/compiler-*

      # Publication belongs to this platform, not the matrix completion barrier.
      # The checksum is uploaded last, making the platform selectable only after
      # its archive and compiler provenance are available.
      - name: Publish checked platform independently
        working-directory: ${{ matrix.zig && format('{0}/client-release/{1}', runner.temp, matrix.target) || format('{0}/release-client/{1}', github.workspace, matrix.target) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          publish_dir="$RUNNER_TEMP/platform-release"
          mkdir -p "$publish_dir"
          cp "dist/justrust-${{ matrix.target }}.tar.gz" \
            "dist/justrust-${{ matrix.target }}.tar.gz.sha256" \
            dist/compiler-${{ matrix.target }}.* "$publish_dir/"
          python3 ci/publish-platform-release.py --tag "$TAG" --sha "$SHA" \
            --target "${{ matrix.target }}" --dist "$publish_dir" --repo "$GITHUB_REPOSITORY"

  release:
    if: ${{ !inputs.recover_linux_x86 }}
    # This is a completion report, never a publication gate for faster platforms.
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: ci
      - name: Verify all platforms completed publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: python3 ci/promote-complete-release.py --tag "$TAG" --sha "$SHA" --repo "$GITHUB_REPOSITORY"

  production-tests:
    needs: [preflight, release]
    uses: ./.github/workflows/client-production-tests.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
      sha: ${{ needs.preflight.outputs.sha }}
    secrets: inherit
