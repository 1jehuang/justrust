[package]
name = "blaze-source"
description = "where a package comes from, as cargo 1.99 names it: SourceId and the names of the directories cargo keeps a source in, with no I/O"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
rustc-hash.workspace = true
# The hasher cargo names a source's directories with.
rustc-stable-hash = "0.1.2"
semver.workspace = true
serde.workspace = true
url.workspace = true

[lints]
workspace = true
