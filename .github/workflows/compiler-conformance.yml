name: Compiler compatibility evidence index

on:
  push:
    branches: [main]
    paths: ['src/**', 'libraries/**', 'tests/**', 'tools/**', 'data/compiler-*.json', 'Cargo.toml', '.github/workflows/compiler-conformance.yml']
  pull_request:
    paths: ['src/**', 'libraries/**', 'tests/**', 'tools/**', 'data/compiler-*.json', 'Cargo.toml', '.github/workflows/compiler-conformance.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate requirement and acceptance mapping
        run: python3 tools/conformance.py validate
      - name: Acquire digest-pinned Reference input for source-proof checks
        run: |
          python3 tools/acquire_pinned_reference.py --output-dir "$RUNNER_TEMP/compatibility-reference" > "$RUNNER_TEMP/reference-input.json"
          python3 - "$RUNNER_TEMP/reference-input.json" "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          if data['readiness'] != 'input-verified' or data['verified_files'] != 190:
              raise SystemExit('pinned Reference input was not verified')
          with Path(sys.argv[2]).open('a') as output:
              output.write('JUSTRUST_WITNESS_REFERENCE_ROOT=' + data['source_root'] + '\n')
              output.write('JR_REFERENCE_ARCHIVE=' + data['archive_path'] + '\n')
          PY
      - name: Acquire three digest-pinned library documentation pages
        run: |
          python3 tools/acquire_pinned_library_pages.py --output-dir "$RUNNER_TEMP/compatibility-library" > "$RUNNER_TEMP/library-input.json"
          python3 - "$RUNNER_TEMP/library-input.json" "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          if (data['readiness'] != 'input-verified' or data['verified_pages'] != 3
                  or data['verified_anchors'] != 7 or data['compatibility_credit'] is not False):
              raise SystemExit('pinned library pages were not verified')
          with Path(sys.argv[2]).open('a') as output:
              output.write('JR_LIBRARY_WITNESS_HTML_ROOT=' + data['html_root'] + '\n')
          PY
      - name: Reject malformed and false-success evidence
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify partial library witness documentation bytes and anchors
        run: python3 tools/library_witness_sources.py --html-root "$JR_LIBRARY_WITNESS_HTML_ROOT"
      - name: Validate source-referenced inventory without inferring support
        run: python3 tools/compatibility_inventory.py --source-archive "$JR_REFERENCE_ARCHIVE"
      - name: Report declared test obligations including missing coverage
        run: python3 tools/conformance.py coverage --json
      - name: Show complete native acceptance plan
        run: python3 tools/conformance.py plan --profile full
      # Reference bytes are verified inputs, not semantic review or compiler proof.
      # This job validates the evidence system, not the compiler itself.
      # Actual native acceptance uses the installed stable justrust client via
      # tools/conformance.py run in the hosted development/CI environment.
