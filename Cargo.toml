[package]
name = "justrust"
version = "0.1.0-alpha.7"
edition = "2024"
rust-version = "1.91"
readme = "README.md"
keywords = ["cargo", "build", "compile", "agents", "profiling"]
categories = ["development-tools", "development-tools::build-utils"]
description = "Rust compile as a service for coding agents"
license = "MIT"
repository = "https://github.com/1jehuang/justrust"
# server/ is FSL-licensed and must never ship inside the MIT crate.
# toolchain/ holds the compiler forks (submodules), built separately.
exclude = ["server/", "toolchain/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
libc = "0.2.190"
toml = "1.1.6"
toml_edit = "0.25"
flate2 = "1.1.10"
memchr = "2"
