[package]
name = "scripts"
version = "0.0.0"
edition = "2021"
description = "Build scripts for harness/scripts.py that the applications of apps/apps.json do not run, and the scripts that read their metadata"

[dependencies]
anyhow = "1"
indexmap = "2"
libc = "0.2"
libgit2-sys = "0.18"
libz-sys = { version = "1", features = ["static"] }
num-traits = "0.2"
openssl = "0.10"
openssl-sys = "0.9"
proc-macro2 = "1"
ring = "0.17"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zstd = "0.13"
zstd-sys = "2"

[workspace]
