name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must exist)"
        required: true

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Marks the binaries as release builds: they update themselves
  # (src/update.rs). Source builds never do.
  JUSTRUST_RELEASE_BUILD: "1"
  # Immutable bootstrap client with fail-closed hosted routing support.
  HOSTED_CLIENT_REV: c026ee88f391bcf74239efbc061bcca43640c17f
  # Small, fast release binaries without editing Cargo.toml.
  DIST_FLAGS: >-
    --config profile.release.lto="thin"
    --config profile.release.codegen-units=1
    --config profile.release.strip=true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Verify release tag, stable ancestry, and version
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" == v* ]]
          git check-ref-format "refs/tags/$TAG"
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" refs/remotes/origin/stable
          git show "$sha:Cargo.toml" > "$RUNNER_TEMP/release-Cargo.toml"
          version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$RUNNER_TEMP/release-Cargo.toml")
          [[ "$TAG" == "v$version" ]] || { echo "Tag $TAG does not match package version $version" >&2; exit 1; }
          printf 'sha=%s\ntag=%s\n' "$sha" "$TAG" >> "$GITHUB_OUTPUT"

      # Reuse CI's existing push run, not a PR merge commit's result.
      - name: Require successful CI for exact tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          while (( SECONDS < deadline )); do
            runs=$(timeout 45s gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" -f event=push -f status=success -f per_page=100)
            if jq -e --arg sha "$SHA" '.workflow_runs | any(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")' <<< "$runs" >/dev/null; then
              echo "CI passed for $SHA"
              exit 0
            fi
            echo "Waiting for successful CI for $SHA (up to 60 minutes)"
            sleep 30
          done
          echo "Timed out waiting for successful CI for $SHA" >&2
          exit 1

  build:
    needs: preflight
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ matrix.zig && 'justrust-hosted-linux' || format('justrust-release-{0}-{1}', github.run_id, matrix.target) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: x86_64-apple-darwin
            os: macos-latest
            zig: false
          - target: aarch64-apple-darwin
            os: macos-latest
            zig: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zig: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Install Rust
        if: ${{ !matrix.zig }}
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable

      - name: Build
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          # shellcheck disable=SC2086
          cargo build --release --locked --target "${{ matrix.target }}" $DIST_FLAGS

      - name: Require hosted Linux credentials
        if: ${{ matrix.zig }}
        env:
          JCODE_API_KEY: ${{ secrets.JCODE_API_KEY }}
        run: ': "${JCODE_API_KEY:?Configure JCODE_API_KEY for hosted Linux releases}"'

      - name: Install hosted Linux prerequisites
        if: ${{ matrix.zig }}
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends rsync zstd binutils qemu-user
          git fetch --quiet --no-tags --depth=1 origin "$HOSTED_CLIENT_REV"
          git show "$HOSTED_CLIENT_REV:ci/install-hosted-client.sh" > "$RUNNER_TEMP/install-hosted-client.sh"
          git show "$HOSTED_CLIENT_REV:ci/check-linux-release.sh" > "$RUNNER_TEMP/check-linux-release.sh"
          bash "$RUNNER_TEMP/install-hosted-client.sh" "$HOSTED_CLIENT_REV"

      - name: Build and verify hosted Linux release
        if: ${{ matrix.zig }}
        env:
          JCODE_API_KEY: ${{ secrets.JCODE_API_KEY }}
          JUSTRUST_TOOLCHAIN: 1.99.0
          JUSTRUST_TOOLCHAIN_REQUIRED: "1"
          JUSTRUST_REMOTE_REQUIRED: "1"
        run: |
          justrust remote use hosted
          # shellcheck disable=SC2086
          justrust build --remote --release --locked --target "${{ matrix.target }}" --bin justrust $DIST_FLAGS
          version=$(cargo +1.99.0 metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "justrust") | .version')
          bash "$RUNNER_TEMP/check-linux-release.sh" "target/${{ matrix.target }}/release/justrust" "${{ matrix.target }}" "$version"

      - name: Package
        shell: bash
        run: |
          name="justrust-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # The matrix expands to a known literal during actionlint's shellcheck.
          # shellcheck disable=SC2193
          cp "target/${{ matrix.target }}/release/justrust$( [[ "${{ matrix.target }}" == *windows* ]] && echo .exe )" "dist/$name/"
          cp README.md "dist/$name/" 2>/dev/null || true
          cp LICENSE* "dist/$name/" 2>/dev/null || true
          cd dist
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: justrust-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          # Builds are pinned to SHA. Refuse a moved/deleted tag before upload.
          ref=$(jq -rn --arg ref "refs/tags/$TAG" '$ref | @uri')
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
          [[ "$current" == "$SHA" ]] || { echo "Release tag moved after preflight" >&2; exit 1; }
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
