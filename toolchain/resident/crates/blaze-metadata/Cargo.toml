[package]
name = "blaze-metadata"
description = "cargo metadata with its resolve, made by blaze: the workspace read by blaze-manifest, the lock file's packages fetched by blaze-registry, resolved by blaze-resolve"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
rustc-hash.workspace = true
blaze-manifest.workspace = true
blaze-registry = { path = "../blaze-registry" }
blaze-resolve = { path = "../blaze-resolve" }
blaze-units.workspace = true
cargo-util-schemas = "=0.14.3"
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
url.workspace = true

[lints]
workspace = true
