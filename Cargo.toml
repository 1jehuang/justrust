[package]
name = "justrust-engine"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace]
members = ["crates/graph", "crates/cache", "crates/source-config"]
default-members = [".", "crates/graph", "crates/cache", "crates/source-config"]
resolver = "3"

[dependencies]
justrust-graph = { path = "crates/graph" }
justrust-cache = { path = "crates/cache" }
justrust-source-config = { path = "crates/source-config" }
blake3 = { version = "=1.8.7", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
unicode-ident = "=1.0.24"

[dev-dependencies]
justrust-graph = { path = "crates/graph", features = ["test-support"] }

[features]
allocation-profile = []

[lib]
name = "justrust_engine"
path = "src/lib.rs"

[[bin]]
name = "jr-prototype"
path = "src/main.rs"

[[bin]]
name = "jr-rust"
path = "src/compiler_cli.rs"

# The compiler under test runs thousands of times per suite; an unoptimized
# binary made the Adler2 probe and acceptance tests roughly 8x slower.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# These modules retain the compiler profile after extraction, rather than
# inheriting the optimized third-party dependency override.
[profile.dev.package.justrust-graph]
opt-level = 1

[profile.dev.package.justrust-cache]
opt-level = 1

[profile.dev.package.justrust-source-config]
opt-level = 1

# Keep optimized test execution, but skip cross-codegen-unit ThinLTO in the
# edit/test loop. Full debug info, assertions, and release builds are unchanged.
[profile.test]
lto = "off"

[profile.release]
debug = 1
