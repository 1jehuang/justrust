name: Validate native SSH retirement (manual canary only)

# Never run for pushes or PRs. Dispatch only after coordinator approval and while
# the existing secret's account is exclusively fenced against other lease users.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Reviewed 40-character stable commit containing the acceptance harness"
        required: true
      candidate_url:
        description: "Immutable official HTTPS candidate URL (allowlisted below)"
        required: true
      candidate_sha256:
        description: "Reviewed lowercase SHA256 of the candidate executable"
        required: true
      expected_lease:
        description: "Exact existing lease SHA256 for the JCODE_API_KEY account"
        required: true
      exclusive_canary_fence:
        description: "Coordinator approved this run and exclusively fenced this account"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

# Also serialize against the hosted build workflow, which uses the same secret.
# This is not an account-wide lock. The operator must maintain the external fence.
concurrency:
  group: justrust-hosted-linux
  cancel-in-progress: false

jobs:
  retirement:
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      CANDIDATE_URL: ${{ inputs.candidate_url }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      EXPECTED_LEASE: ${{ inputs.expected_lease }}
      EXCLUSIVE_CANARY_FENCE: ${{ inputs.exclusive_canary_fence }}
      BUILD_BASE: https://build.jcode.sh/v1
    steps:
      - name: Validate immutable inputs before checkout or credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXCLUSIVE_CANARY_FENCE" == true ]]
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_LEASE" =~ ^[0-9a-f]{64}$ ]]
          printf '::add-mask::%s\n' "$EXPECTED_LEASE"

      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0
          # The vendored compiler is not needed for this no-build gate.
          sparse-checkout: |
            scripts/native-only-acceptance.py
            scripts/native-hosted-acceptance.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require reviewed source on trusted stable history
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_REF^{commit}"
          git merge-base --is-ancestor "$SOURCE_REF" refs/remotes/origin/stable
          git checkout --detach "$SOURCE_REF"
          test -f scripts/native-only-acceptance.py
          test -f scripts/native-hosted-acceptance.py

      - name: Download and verify immutable official candidate without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import time
          import urllib.request

          url = os.environ['CANDIDATE_URL']
          digest = os.environ['CANDIDATE_SHA256']
          # Fixed official origin/path only, no userinfo, ports, query strings,
          # fragments, percent escapes, redirects, or arbitrary download hosts.
          allowed = (r'https://jcode-justrust-prebuilt-production-280196252242\.s3\.amazonaws\.com/v1/native/'
                     + digest + r'/justrust')
          if re.fullmatch(allowed, url) is None:
              raise SystemExit('Candidate URL is outside the immutable official allowlist')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('Candidate redirects are forbidden')

          opener = urllib.request.build_opener(NoRedirect())
          target = Path(os.environ['RUNNER_TEMP']) / 'native-retirement-candidate'
          sha = hashlib.sha256()
          size = 0
          deadline = time.monotonic() + 120
          try:
              with opener.open(url, timeout=60) as response, target.open('xb') as output:
                  while block := response.read(1024 * 1024):
                      if time.monotonic() > deadline:
                          raise RuntimeError('Candidate download deadline exceeded')
                      size += len(block)
                      if size > 256 * 1024 * 1024:
                          raise RuntimeError('Candidate exceeds download bound')
                      sha.update(block)
                      output.write(block)
              if not size or sha.hexdigest() != digest:
                  raise RuntimeError('Candidate SHA256 verification failed')
              target.chmod(0o700)
          except Exception:
              target.unlink(missing_ok=True)
              raise SystemExit('Candidate download or verification failed') from None
          print('Official candidate SHA256 verified')
          PY

      - name: Exact-lease retirement, native command, and fresh SSH rollback gates
        env:
          JCODE_API_KEY: ${{ secrets.JCODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${JCODE_API_KEY:?Existing JCODE_API_KEY repository secret is required}"
          command -v ssh
          command -v ssh-keygen
          # The existing harness performs non-allocating exact-lease preflight,
          # verifies receipt/ack bindings, requires actual connection refusal
          # (timeouts remain failures), and finally restores fresh pinned SSH.
          # Never wrap it in an external timeout that could interrupt rollback.
          python3 scripts/native-only-acceptance.py \
            --candidate "$RUNNER_TEMP/native-retirement-candidate" \
            --expected-lease "$EXPECTED_LEASE" \
            --build-base "$BUILD_BASE" \
            --timeout 60

      - name: Remove downloaded executable
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/native-retirement-candidate"
