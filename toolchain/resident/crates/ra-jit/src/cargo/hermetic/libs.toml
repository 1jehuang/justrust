# The system libraries a build script is given besides the toolchain, by crate: what
# crate2nix's defaultCrateOverrides is to nixpkgs. Each name is a root `closure/pins.txt`
# pins for both Linux hosts (a nixpkgs attribute, with its output where it has several:
# `openssl.dev` has the headers and `.pc` files and refers to `openssl.out`). A crate not
# here gets the toolchain and the sysroot only. `versions` is a semver requirement (all
# versions when left out). A workspace adds or replaces entries under
# `[workspace.metadata.blaze.system-deps]`: `openssl-sys = ["openssl.out", "openssl.dev"]`.
# Adding a crate is one entry here, and its roots in harness/closure_pins.py when pins.txt
# lacks them.

[openssl-sys]
libs = ["openssl.out", "openssl.dev"]

[libz-sys]
libs = ["zlib.out", "zlib.dev"]

[libgit2-sys]
libs = ["libgit2.lib", "libgit2.dev", "openssl.out", "openssl.dev", "zlib.out", "zlib.dev"]

[libssh2-sys]
libs = ["libssh2.out", "libssh2.dev", "openssl.out", "openssl.dev", "zlib.out", "zlib.dev"]

[curl-sys]
libs = ["curl.out", "curl.dev", "openssl.out", "openssl.dev", "zlib.out", "zlib.dev"]

[libsqlite3-sys]
libs = ["sqlite.out", "sqlite.dev"]

[zstd-sys]
libs = ["zstd.out", "zstd.dev"]

[lzma-sys]
libs = ["xz.out", "xz.dev"]

[bzip2-sys]
libs = ["bzip2.out", "bzip2.dev"]

[onig_sys]
libs = ["oniguruma.lib", "oniguruma.dev"]

[alsa-sys]
libs = ["alsa-lib.out", "alsa-lib.dev"]

[freetype-sys]
libs = ["freetype.out", "freetype.dev", "zlib.out", "zlib.dev", "bzip2.out", "bzip2.dev"]

[yeslogic-fontconfig-sys]
libs = ["fontconfig.lib", "fontconfig.dev", "freetype.out", "freetype.dev"]

[servo-fontconfig-sys]
libs = ["fontconfig.lib", "fontconfig.dev", "freetype.out", "freetype.dev"]

[x11]
libs = ["libx11.out", "libx11.dev"]

[x11-dl]
libs = ["libx11.out", "libx11.dev"]

[xkbcommon-sys]
libs = ["libxkbcommon.out", "libxkbcommon.dev"]

[wayland-sys]
libs = ["wayland.out", "wayland.dev"]

[libdbus-sys]
libs = ["dbus.lib", "dbus.dev"]

[protobuf-src]
libs = ["cmake"]

[wasmtime-c-api-impl]
libs = ["cmake"]

[aws-lc-sys]
libs = ["cmake"]
