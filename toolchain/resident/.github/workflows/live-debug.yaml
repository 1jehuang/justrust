# Live edits on macOS arm64 alone, with the daemon's and the workers' logs kept: for chasing a
# live-edit failure without the rest of nix-live.yaml. Runs on a push to a live-debug* branch.
name: live edits (debug)
on:
  push:
    branches: ["live-debug*"]
  workflow_dispatch:
    inputs:
      edits:
        description: how many edits the running program takes
        default: "5"

concurrency:
  group: live-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  live-edits:
    name: live edits (macOS arm64, debug)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: tc=$(cat harness/toolchain) && rustup toolchain install "$tc" --profile minimal -c rust-src && rustup default "$tc"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: live-debug
      - run: cargo build --release -p ra-jit
      - name: edit a running program, edit after edit
        env:
          LIVE_EDITS: ${{ inputs.edits || '8' }}
          RUST_BACKTRACE: "1"
          RA_JIT_IDLE_SECS: "0"
        run: RA_JIT_BIN="$GITHUB_WORKSPACE/target/release/ra-jit" python3 harness/live_e2e.py
      - name: what the daemon and its workers said
        if: always()
        run: |
          home="$HOME/.cache/ra-jit"
          echo "::group::daemon.log"; cat "$home/daemon.log" || true; echo "::endgroup::"
          for log in "$home"/workers/*/log "$home"/spares/*/log; do
            [ -f "$log" ] || continue
            echo "::group::$log (filtered)"
            grep -E "change:|edit|patch|link:|live:|panicked|Error|error|ended|not spliced|without a stable name|cold:" "$log" | cut -c1-300 || true
            echo "::endgroup::"
          done
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ra-jit-logs
          path: |
            ~/.cache/ra-jit/daemon.log
            ~/.cache/ra-jit/workers/*/log
            ~/.cache/ra-jit/spares/*/log
            ~/.cache/ra-jit/live
          if-no-files-found: warn
