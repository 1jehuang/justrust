# `[target]` tables of a triple and of `cfg`s, one matching only under a flag another adds:
# cargo's probe of the target runs twice, and warns that the flags still change.
[build]
rustflags = ["-Cdebug-assertions=off"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["--cfg", "linux_gnu_x86"]

[target.'cfg(target_os = "linux")']
rustflags = ["-Coverflow-checks=on"]

[target.'cfg(all())']
rustflags = ["--cfg", "everywhere"]

[target.'cfg(everywhere)']
rustflags = ["-Cpanic=abort"]

[target.'cfg(windows)']
rustflags = ["-Copt-level=1"]
