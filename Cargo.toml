[package]
name = "justrust"
version = "0.1.0"
edition = "2024"
description = "An attempt at a faster all-in-one Rust compiling solution for coding agents"
license = "MIT"
repository = "https://github.com/1jehuang/justrust"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "6"
