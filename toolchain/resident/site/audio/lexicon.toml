# How the narration voice (Drama 3) says words it gets wrong. audio/README.md, "Pronunciation".
# Each entry was checked by synthesising a short sentence and transcribing it with Whisper; words the voice already
# reads well (Mathlib, Aeneas, Kani, CBOR, flecs, wasm, async, dyn, impl, Vec, u32, FFI, Pointee, x86-64, ...) are
# left out on purpose.

[words]
# Whole word, case-sensitive: display form = spoken form. A spoken form may not contain [ ] < >.
"rustc" = "rust C"                  # default: "rust-sea"
"ra-jit" = "R A jit"                # default: "Rajeed", "Ragit"
"MIR" = "M I R"                     # default: "mer"
"crates.io" = "crates dot I O"
"CID" = "C I D"                     # default: "sig"
"Verus" = "Veer us"                 # default: "Varys"; "Vee-rus" came out as "virus"
"Creusot" = "Croo-zo"               # default: "Creosaw"
"Prusti" = "Proo-stee"              # default: "Pristi"
"hax" = "hacks"                     # default: "hex"
"Err" = "Error"                     # default: "air"
"e.g." = "for example"              # default: letters, "E G"
"i.e." = "that is"                  # default: "I E"
"stdin" = "standard in"             # default: "st-ein"
"aarch64" = "A arch 64"             # default: drops the first a
"sans-IO" = "sans I O"              # default: "Sun's IO"
"SortedLE" = "Sorted L E"           # default: "sortedly"
"Jung" = "Yoong"                    # Ralf Jung; default: "Ewing"

[[rules]]
# Regexes (Python re), after the words, within one whitespace-separated word.
name = "version"                    # 1.99.0 was read "1009.0"
pattern = '(?<![\w.])(\d+)\.(\d+)\.(\d+)(?![\w]|\.\d)'
spoken = '\1 point \2 point \3'

[[rules]]
name = "path slash"                 # docs/benchmarks/history: the slash was read "hyphen"; I/O is left alone
pattern = '(?<=[A-Za-z]{2})/(?=[A-Za-z]{2})'
spoken = ' slash '
