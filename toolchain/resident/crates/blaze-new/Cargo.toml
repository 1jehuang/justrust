[package]
name = "blaze-new"
description = "cargo new and cargo init, made by blaze: the package's manifest, source, ignore file and repository written as cargo writes them"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
cargo-util-schemas = "=0.14.3"
glob = "0.3.3"
pathdiff = "0.2.3"
toml_edit = { version = "=0.25.12", default-features = false, features = ["display", "parse"] }

[lints]
workspace = true
