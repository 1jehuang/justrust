# `playground` is the page, a Dioxus app rustc builds. `app` is the Dioxus program the page
# shows: ra-jit compiles it in the page and links it into the page itself, whose Dioxus and
# `std` it calls into.
[workspace]
members = ["app", "playground"]
resolver = "3"

[workspace.dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch"] }

# 0.2.129 keeps JS promise integration in the module, which `--export-all` cannot drop, and
# browsers without `exnref` then refuse the module.
wasm-bindgen = "=0.2.122"

[profile.dev]
panic = "abort"
debug = 0
