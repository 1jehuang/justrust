# A crate each lint `cargo blaze clippy` has fires in, beside its levels set every way clippy
# takes them, for `harness/clippydiff.py` to compare with stock clippy's.
[package]
name = "clippy-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[lints.clippy]
map_unwrap_or = "warn"
