[package]
name = "justrust"
version = "0.1.0-alpha.26"
edition = "2024"
rust-version = "1.91"
readme = "README.md"
keywords = ["cargo", "build", "compile", "agents", "profiling"]
categories = ["development-tools", "development-tools::build-utils"]
description = "Rust compile as a service for coding agents"
license = "MIT"
repository = "https://github.com/1jehuang/justrust"
# toolchain/ holds the fully vendored compiler forks, built separately.
exclude = ["/toolchain/", "/.wrangler/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
libc = "0.2.190"
toml = "1.1.6"
toml_edit = "0.25"
flate2 = "1.1.10"
tar = "0.4"
memchr = "2"
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "pe", "macho", "std", "unaligned"] }
memmap2 = "0.9.11"
# Explicitly opt-in terminal dashboard, bundled in the normal client binary.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
unicode-width = "0.2"
tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-native-roots", "handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "process", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "getrandom", "std"] }
sha2 = "0.10"

# Large artifact round trips otherwise spend their test time in debug DEFLATE.
# Keep the client itself unoptimized for fast edit/build loops. Release is unchanged.
[profile.dev.package.miniz_oxide]
opt-level = 3

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
